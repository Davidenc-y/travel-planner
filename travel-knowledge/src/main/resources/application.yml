# ============================================================
# travel-knowledge 服务配置（端口 8082；Y-4a 生产切换：C/S 层已删，Nacos 为准）
# 本文件仅保留：接线键 + E 层占位键（datasource/redis/dashscope/es/milvus host-port/internal/minio/etl.import-base-dir）
# ============================================================
# ============ AB-2a：Tomcat 连接器保护三键（L13） ============
# 三键=Spring Boot 默认值显式化（E-33 零行为变更）：80VUS 复压暴露连接器无显式保护面（L13），
# 显式化后极端保护调优有唯一落点；Nacos dataId 同步指令见 docs/zcode/20260926_review/AB批人工操作手册.md 操作④。
server:
  tomcat:
    threads:
      max: 200  # 默认值显式（Boot 默认=200）
    max-connections: 8192  # 默认值显式（Boot 默认=8192）
    accept-count: 100  # 默认值显式（Boot 默认=100，OS backlog）

spring:
  # X-1b：Nacos 配置中心接线（E-33：NACOS_ENABLED=false=整体关闭，禁用解析器跳过 import=零键值变化；
  # optional: 前缀容忍 dataId 缺席；dataId 灌配见 docs/zcode/20260924_review/Nacos部署与灌配手册.md）
  config:
    import: optional:nacos:travel-common.yaml,optional:nacos:travel-knowledge.yaml
  # X-1b：配置中心接线（默认值=E-33 现状等价；server-addr 默认=VM 契约地址）
  cloud:
    nacos:
      config:
        enabled: ${NACOS_ENABLED:true}
        server-addr: ${NACOS_ADDR:192.168.253.129:8848}
        namespace: ${NACOS_NAMESPACE:dev}  # AR-1（X 审计修复）：配置在 dev 命名空间，缺省连 public 拉不到
        group: TRAVEL  # AR-2（X 审计修复）：灌配在 TRAVEL 组，缺省 DEFAULT_GROUP 拉空
      # X-2a：服务发现接线（默认关=不注册不发现；server-addr 为自裁决修订项——discovery
      # 不继承 config 作用域键，缺省回落 localhost:8848，live-fire 陷阱预防）
      discovery:
        enabled: ${NACOS_ENABLED:true}
        server-addr: ${NACOS_ADDR:192.168.253.129:8848}
        namespace: ${NACOS_NAMESPACE:dev}  # AR-1（X 审计修复）：配置在 dev 命名空间，缺省连 public 拉不到
    # Y-2a：Sentinel 主闸（r1 修复：starter 默认自动注册 Web 拦截器，缺主闸=依赖上桌即行为变化；
    # 默认关=全链路不初始化，E-33 关闭态字节等价；开启+dashboard 不可达=fail-open 不影响服务）
    sentinel:
      enabled: ${SENTINEL_ENABLED:false}
      transport:
        dashboard: ${SENTINEL_DASHBOARD:192.168.253.129:8858}
      eager: false
      # Y-2c：规则 Nacos 数据源（r1：namespace/group 显式写死在 datasource 节内，不复用 config 段两键
      # ——AR-1/AR-2 同类陷阱预防；未灌配 dataId=无规则=全放行零行为；灌配手册见 docs/zcode/20260925_review/）
      datasource:
        flow-ds:
          nacos:
            server-addr: ${NACOS_ADDR:192.168.253.129:8848}
            namespace: dev
            groupId: TRAVEL  # AR-3（Y 审计修复）：SCA datasource 属性名是 groupId，group 被静默忽略→DEFAULT_GROUP 拉空
            data-id: travel-sentinel-flow-knowledge.json
            rule-type: flow
        # AB-2b：system 规则 Nacos 数据源（系统自适应保护=L13 极端并发第二层；与 flow 同构，
        # 属性名口径 groupId（AR-3）；dataId 模板已由审计先行产出
        # docs/zcode/20260926_review/sentinel_system/，灌配归人工（AB批人工操作手册.md 操作②同流程）；
        # 未灌配=无规则=零行为（E-33，同 flow 模式））
        system-ds:
          nacos:
            server-addr: ${NACOS_ADDR:192.168.253.129:8848}
            namespace: dev
            groupId: TRAVEL
            data-id: travel-sentinel-system-knowledge.json
            rule-type: system
  # ============ 数据源 ============
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/travel_planner?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:root}
    # S0 扫描拦截顺带修复（D-04-002）：受控配置不携带默认口令；本地在 application-local.yml 覆盖
    password: ${MYSQL_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  # ============ Redis ============
  # DG-3c：恢复 spring.data.redis.*（EtlOutbox/ChangeEventConsumer Redis Stream
  # travel:etl:changes 兜底一致性通道；模式照抄 planning），原 M10-1a"零引用移除"自本步起失效。
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  # ============ AI DashScope（仅 reranker 直连使用；Chat/Embedding 走 M7 注册表） ============
  ai:
    dashscope:
      api-key: ${DASHSCOPE_API_KEY:}

  # ============ Elasticsearch ============
  elasticsearch:
    uris: http://${ES_HOST:localhost}:${ES_PORT:9200}

# ============ Milvus ============
milvus:
  host: ${MILVUS_HOST:localhost}
  port: ${MILVUS_PORT:19530}

# ============ 应用专属配置 ============
travel:
  # M21-3（SEC-02-04）：服务间共享密钥（空缺省=fail-closed；本地在 application-local.yml 覆盖）
  internal:
    token: ${TRAVEL_INTERNAL_TOKEN:}
  # M7 Batch 4：模型注册表（单一事实源；chatModel/lightModel 由 gateway 提供）
  ai:
    # MM-7：Embedding 模型键配置化（默认值与原硬编码常量逐字节一致；未配置=零行为变化）
    embedding:
      model: ${AI_EMBEDDING_MODEL:text-embedding-v2}
  # F104 P1：MinIO 业务对象存储（docker-compose travel-minio，9000/9001）
  minio:
    endpoint: http://${MIDDLEWARE_HOST:192.168.253.129}:9000
    access-key: minioadmin
    secret-key: minioadmin
    attractions-bucket: attractions
    avatars-bucket: avatars
    # F121：对象访问模式（proxy=应用代理（默认）；presign=签名 URL；direct=公网直连）
    access-mode: proxy
    # direct 模式时 MinIO 公网端点；为空则回退 endpoint
    public-endpoint: ""
    # 创建新桶时允许公开读的桶（仅景点图；avatars 保持私有）
    public-buckets:
      - attractions
  # ETL 配置
  etl:
    # M21-3（SEC-02-05）：导入白名单根目录（空缺省=导入功能关闭；本地/回归环境显式配置）
    import-base-dir: ${ETL_IMPORT_BASE_DIR:}
