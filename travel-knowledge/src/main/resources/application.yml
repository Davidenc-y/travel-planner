# ============================================================
# travel-knowledge 服务配置（端口 8082）
# ============================================================
server:
  port: 8082
  servlet:
    context-path: /
  # F30：允许查询参数中出现原始反斜杠（Windows 路径 filePath，如 D:\...）
  # Tomcat 默认按 RFC 7230/3986 拒绝 '\'，导致 TC-13 直接返回 HTTP 400。
  tomcat:
    relaxed-query-chars: '\'

spring:
  application:
    name: travel-knowledge

  # ============ 数据源 ============
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/travel_planner?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:root123}
    driver-class-name: com.mysql.cj.jdbc.Driver

  # ============ Redis ============
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # password: 不设置 — Redis 无密码，避免 Redisson 发送 AUTH 空密码
      # 如需密码，设置环境变量 SPRING_DATA_REDIS_PASSWORD=yourpassword
      database: 0
      timeout: 5000ms

  # ============ AI DashScope（Embedding 必需） ============
  ai:
    dashscope:
      api-key: ${DASHSCOPE_API_KEY:}
      chat:
        options:
          model: qwen3.7-max # SelfRAG/CorrectiveRAG 使用；qwen-plus 免费额度耗尽 -> 403
      embedding:
        api-key: ${DASHSCOPE_API_KEY:}
        model: text-embedding-v2

  # ============ Elasticsearch ============
  elasticsearch:
    uris: http://${ES_HOST:localhost}:${ES_PORT:9200}

# ============ MyBatis Plus ============
mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# ============ Milvus ============
milvus:
  host: ${MILVUS_HOST:localhost}
  port: ${MILVUS_PORT:19530}
  collection-name: attraction_vectors

# ============ 应用专属配置 ============
travel:
  # RAG 默认策略
  rag:
    default-type: hybrid
    # P3：auto 复杂查询首选路由（supervisor / agent / heuristic），用于 A/B 对比
    auto-router: supervisor
    # P3：查询理解配置（LLM 抽取开关 / 意图缓存 / 城市与类型清单）
    query-understanding:
      enabled: true
      cache-size: 256
      cities: 北京,上海,广州,深圳,杭州,成都,西安,厦门,南京,天津,重庆,武汉,长沙,苏州,桂林,青岛,大连,三亚
      type-keywords:
        CULTURE: [文化, 博物馆, 古迹, 历史]
        NATURE: [自然, 山水, 公园, 湖泊]
        FOOD: [美食, 小吃, 餐厅]
        SHOPPING: [购物, 逛街, 商场]
        FAMILY: [亲子, 家庭, 乐园, 儿童]
        LEISURE: [休闲, 度假, 放松]
  # ETL 配置
  etl:
    batch-size: 100
    schedule-cron: "0 0 3 * * ?"   # 每天 3 点增量 ETL
  # F90：用户面端点限流（按 userId+接口，每分钟）
  rate-limit:
    per-minute: 100
  # F89：RAG 链路追溯开关
  trace:
    enabled: true
  # F87/F92：前端跨域白名单（精确 origin；代码层叠加 localhost:* 通配）
  cors:
    allowed-origins: http://localhost:3000,http://127.0.0.1:3000,http://localhost:3100,http://127.0.0.1:3100

# ============ Actuator ============
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

# ============ 日志 ============
logging:
  level:
    com.travel: DEBUG
    # F33：Milvus SDK 内部重试告警收敛。SDK 在 gRPC 瞬时断流/参数校验失败时会打印
    # ERROR + 全栈（如 DescribeCollectionRequest ... end-of-stream mid-frame），
    # 随后由 SDK retry 自动恢复并成功写入。数据完整性由业务侧 ETL 成功/失败统计兜底，
    # 此处 OFF 避免每条重试刷屏；如需深入排查 Milvus 连接可临时改为 INFO/DEBUG。
    # 注意：必须带引号写 "OFF"——SnakeYAML（YAML 1.1）会把裸 OFF 解析为布尔 false，
    # Spring Boot 2.2+ 将布尔 false 静默忽略（日志级别不生效）。
    io.milvus: "OFF"
    org.springframework.ai: INFO
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n"
