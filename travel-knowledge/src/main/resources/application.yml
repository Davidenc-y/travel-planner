# ============================================================
# travel-knowledge 服务配置（端口 8082）
# ============================================================
server:
  port: 8082
  servlet:
    context-path: /
  # F30：允许查询参数中出现原始反斜杠（Windows 路径 filePath，如 D:\...）
  # Tomcat 默认按 RFC 7230/3986 拒绝 '\'，导致 TC-13 直接返回 HTTP 400。
  tomcat:
    relaxed-query-chars: '\'

spring:
  application:
    name: travel-knowledge
  # F104 P1：图片上传 ≤5MB（默认 1MB 会拒收）
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

  # ============ 数据源 ============
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/travel_planner?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:root123}
    driver-class-name: com.mysql.cj.jdbc.Driver

  # ============ Redis ============
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # password: 不设置 — Redis 无密码，避免 Redisson 发送 AUTH 空密码
      # 如需密码，设置环境变量 SPRING_DATA_REDIS_PASSWORD=yourpassword
      database: 0
      timeout: 5000ms

  # ============ AI DashScope（仅 reranker 直连使用；Chat/Embedding 走 M7 注册表） ============
  ai:
    dashscope:
      api-key: ${DASHSCOPE_API_KEY:}
    # M8-9b：禁用 Spring AI MCP client 自动装配——启动期 initialize 失败会直接终止应用
    # （实测 20s 超时后抛异常），无法满足“web-search 灰度不阻断启动”。
    # 联网搜索由 McpWebSearchAdapter 后台自行建立 MCP stdio 连接（MCP Java SDK），
    # 连接失败仅降级为空搜索工具；LLM 仍无自由搜索工具，注入面不扩大。
    mcp:
      client:
        enabled: false
        type: SYNC
        toolcallback:
          enabled: false

  # ============ Elasticsearch ============
  elasticsearch:
    uris: http://${ES_HOST:localhost}:${ES_PORT:9200}

# ============ MyBatis Plus ============
mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# ============ Milvus ============
milvus:
  host: ${MILVUS_HOST:localhost}
  port: ${MILVUS_PORT:19530}
  collection-name: attraction_vectors

# ============ 应用专属配置 ============
travel:
  # M7 Batch 4：模型注册表（单一事实源；chatModel/lightModel 由 gateway 提供）
  ai:
    model-registry:
      enabled: true
      default-timeout-seconds: 120
      models:
        - key: qwen3.7-max
          provider: dashscope-native
          display-name: "Qwen3.7 Max · 深度推理"
          api-key-env: DASHSCOPE_API_KEY
          temperature: 0.7
          max-tokens: 8000
          top-p: 0.9
          roles: [main]
          selectable: true
          enabled: true
        - key: qwen-turbo
          provider: dashscope-native
          display-name: "Qwen Turbo · 轻量高速"
          api-key-env: DASHSCOPE_API_KEY
          temperature: 0.5
          max-tokens: 2000
          roles: [light]
          selectable: true
          enabled: true
        - key: qwen3.7-plus
          provider: openai-compatible
          # M8-9g 修复：不能带结尾 /v1（Spring AI OpenAiApi 会自动追加 /v1/chat/completions，
          # 否则拼出 /v1/v1/chat/completions → 404）
          base-url: https://dashscope.aliyuncs.com/compatible-mode
          display-name: "Qwen3.7 Plus · 均衡"
          api-key-env: DASHSCOPE_API_KEY
          roles: []
          selectable: true
          enabled: true
        - key: deepseek-chat
          provider: openai-compatible
          base-url: https://api.deepseek.com
          display-name: "DeepSeek Chat · 通用"
          api-key-env: DEEPSEEK_API_KEY
          roles: []
          selectable: true
          enabled: true
        - key: text-embedding-v2
          provider: dashscope-native
          display-name: "Text Embedding v2"
          api-key-env: DASHSCOPE_API_KEY
          roles: [embedding]
          selectable: false
          enabled: true
        - key: gte-rerank-v2
          provider: dashscope-native
          display-name: "GTE Rerank v2"
          api-key-env: DASHSCOPE_API_KEY
          roles: [rerank]
          selectable: false
          enabled: true
  # M6-19：RAG 检索流式
  knowledge:
    stream:
      enabled: true
      timeout-ms: 120000
      keepalive-ms: 15000
      chunk-max-chars: 16
  # F104 P1：MinIO 业务对象存储（docker-compose travel-minio，9000/9001）
  minio:
    endpoint: http://192.168.253.129:9000
    access-key: minioadmin
    secret-key: minioadmin
    attractions-bucket: attractions
    avatars-bucket: avatars
    # F121：对象访问模式（proxy=应用代理（默认）；presign=签名 URL；direct=公网直连）
    access-mode: proxy
    # direct 模式时 MinIO 公网端点；为空则回退 endpoint
    public-endpoint: ""
    # 创建新桶时允许公开读的桶（仅景点图；avatars 保持私有）
    public-buckets:
      - attractions
  # RAG 默认策略
  rag:
    default-type: hybrid
    # P3：auto 复杂查询首选路由（supervisor / agent / heuristic），用于 A/B 对比
    auto-router: supervisor
    # P3：查询理解配置（LLM 抽取开关 / 意图缓存 / 城市与类型清单）
    query-understanding:
      enabled: true
      cache-size: 256
      cities: 北京,上海,广州,深圳,杭州,成都,西安,厦门,南京,天津,重庆,武汉,长沙,苏州,桂林,青岛,大连,三亚
      type-keywords:
        CULTURE: [文化, 博物馆, 古迹, 历史]
        NATURE: [自然, 山水, 公园, 湖泊]
        FOOD: [美食, 小吃, 餐厅]
        SHOPPING: [购物, 逛街, 商场]
        FAMILY: [亲子, 家庭, 乐园, 儿童]
        LEISURE: [休闲, 度假, 放松]
      # M8-2：type 同义词表（M7-8 幻觉校验用；与 type-keywords 合并为单源，yml 可覆盖扩展）
      type-synonyms:
        CULTURE: [文物, 遗址, 民俗, 展览, 古迹, 博物馆]
        NATURE: [爬山, 风景, 森林, 海边, 湖泊]
        FOOD: [好吃, 火锅, 烧烤, 美食街, 小吃街, 吃, 菜]
        SHOPPING: [购物街, 买]
        FAMILY: [孩子, 带娃, 儿童]
        LEISURE: [温泉, 慢生活]
    # M8-1：检索结果结构化补全（false 时 AttractionEnricher 直通，行为回到 M8-1 之前）
    enrichment:
      enabled: true
    # M8-4：MCP 联网搜索兜底（默认关；灰度开启后仅本地缺失字段触发，限频+熔断+超时）
    web-search:
      enabled: false
      timeout-ms: 1500
      rate-limit-per-minute: 10
      daily-quota: 100
      enrich-fields: [openHours, ticketPrice]
      writeback-enabled: false
    # M4-6：Rerank SPI（none=直通默认；dashscope 启用 gte-rerank-v2，失败 fail-open）
    rerank:
      type: none
      candidate-pool: 20
      timeout-ms: 2000
      # M7 Batch 4：rerank 模型配置化（默认不变）
      model: gte-rerank-v2
    # M8-9d：候选质量感知选择（默认关=顺序截断，行为与现状一致；灰度开启见 local）
    quality:
      enabled: false
      candidate-pool: 20
      weight: 0.35
      description-weight: 0.35
      rating-weight: 0.25
      image-weight: 0.10
      tags-weight: 0.10
      empty-description-penalty: 0.20
      zero-rating-penalty: 0.10
    # M8-9e：检索层修复（city 参与评分 + PLANNING 规则化扩展）
    retrieval:
      city-score-boost: 0.5
      # 生产保守默认关；local 灰度开启，验证后可转正
      planning-expansion-enabled: false
      planning-trigger-keywords: [规划, 安排, 行程, 攻略, 几日游, 一日游, 两日游, 三日游, 旅游, 路线, 推荐]
      planning-expansion-words: [旅游, 景点, 推荐, 攻略]
  # ETL 配置
  etl:
    batch-size: 100
    schedule-cron: "0 0 3 * * ?"   # 每天 3 点增量 ETL
    parallelism: 4                 # F119：ETL 并行度（1~8）
    embedding-qps: 4               # F119：DashScope Embedding 全局节流（次/秒）
    timeout-ms: 60000              # F119：单条 ETL 节流等待兜底（毫秒）
  # F90：用户面端点限流（按 userId+接口，每分钟）
  rate-limit:
    per-minute: 100
  # M3-6：业务异常 HTTP 状态与业务码语义对齐（40401→404、50001→500 等）
  api:
    http-status-aligned: true
  # F89：RAG 链路追溯开关
  trace:
    enabled: true
  # F87/F92：前端跨域白名单（精确 origin；代码层叠加 localhost:* 通配）
  cors:
    allowed-origins: http://localhost:3000,http://127.0.0.1:3000,http://localhost:3100,http://127.0.0.1:3100

# ============ Actuator ============
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

# ============ 日志 ============
logging:
  level:
    com.travel: DEBUG
    # F33：Milvus SDK 内部重试告警收敛。SDK 在 gRPC 瞬时断流/参数校验失败时会打印
    # ERROR + 全栈（如 DescribeCollectionRequest ... end-of-stream mid-frame），
    # 随后由 SDK retry 自动恢复并成功写入。数据完整性由业务侧 ETL 成功/失败统计兜底，
    # 此处 OFF 避免每条重试刷屏；如需深入排查 Milvus 连接可临时改为 INFO/DEBUG。
    # 注意：必须带引号写 "OFF"——SnakeYAML（YAML 1.1）会把裸 OFF 解析为布尔 false，
    # Spring Boot 2.2+ 将布尔 false 静默忽略（日志级别不生效）。
    io.milvus: "OFF"
    org.springframework.ai: INFO
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n"
