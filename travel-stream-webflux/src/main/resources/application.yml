server:
  port: 8083

spring:
  application:
    name: travel-stream-webflux
  # M16-3：chat-domain 域共享配置（application-chat.yml，单源在 chat-domain 模块内）
  # 由 ChatDomainConfigEnvironmentPostProcessor（META-INF/spring.factories 注册）以
  # 最低优先级自动装载，本文件与 application-local.yml 的同名键均可覆盖（2026-09-06 修订，
  # 不再使用 spring.config.import——IDEA 无法解析依赖模块 classpath 资源而报错）。
  cloud:
    compatibility-verifier:
      enabled: false
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/travel_planner?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:root}
    # S0 扫描拦截顺带修复（D-04-002）：受控配置不携带默认口令；本地在 application-local.yml 覆盖
    password: ${MYSQL_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    # M10-2d：maxLifetime < MySQL wait_timeout（20min），避免服务端关闭后校验失败
    hikari:
      max-lifetime: 1200000
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      database: 0
      timeout: 5000ms
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

travel:
  # M13-2f：聊天行程回写桥目标（travel-planning MVC 实例）——本进程独有
  planning-base-url: ${PLANNING_BASE_URL:http://localhost:8081}

logging:
  level:
    com.travel: INFO
