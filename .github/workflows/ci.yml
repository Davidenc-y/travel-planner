# M22-4 最小 CI（S4 修订版）：编译门禁。
# D-V8-6d 裁定 tests/scripts 不入库，故 CI 不跑单测（单测由本地离线 mock 体系 +
# scripts/regression/*.ps1 承担）；CI 价值 = push 即验证主源码自洽可编译。
name: compile-gate
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  backend-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build (compile gate)
        run: mvn -B -T 1C package -DskipTests
  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: travel-frontend/next-app/package-lock.json
      - name: Build (compile gate)
        working-directory: travel-frontend/next-app
        run: |
          npm ci
          npm run build
