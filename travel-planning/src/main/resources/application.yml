# ============================================================
# travel-planning 服务配置（端口 8081；Y-4a 生产切换：C/S 层已删，Nacos 为准）
# M16-3：chat-domain 域共享配置照旧经 application-chat.yml 自动装载。
# 本文件仅保留：接线键（nacos/sentinel/openfeign）+ E 层占位键 + Y 系列契约键（health.rabbit）。
# ============================================================
spring:
  # X-1b：Nacos 配置中心接线（E-33：NACOS_ENABLED=false=整体关闭，禁用解析器跳过 import=零键值变化；
  # optional: 前缀容忍 dataId 缺席；dataId 灌配见 docs/zcode/20260924_review/Nacos部署与灌配手册.md）
  config:
    import: optional:nacos:travel-common.yaml,optional:nacos:travel-planning.yaml
  # Spring Cloud 兼容性检查已上收 Nacos travel-common.yaml（Y-4a）
  cloud:
  # M16-3：chat-domain 域共享配置（application-chat.yml，单源在 chat-domain 模块内）
  # 由 ChatDomainConfigEnvironmentPostProcessor（META-INF/spring.factories 注册）以
  # 最低优先级自动装载——本文件与 application-local.yml 的同名键均可覆盖。
  # 不再使用 spring.config.import：IDEA 无法解析依赖模块 classpath 资源而报错
  # （运行时两种机制等价，2026-09-06 修订）。
    # X-1b：配置中心接线（默认值=E-33 现状等价；server-addr 默认=VM 契约地址）
    nacos:
      config:
        enabled: ${NACOS_ENABLED:true}
        server-addr: ${NACOS_ADDR:192.168.253.129:8848}
        namespace: ${NACOS_NAMESPACE:dev}  # AR-1（X 审计修复）：配置在 dev 命名空间，缺省连 public 拉不到
        group: TRAVEL  # AR-2（X 审计修复）：灌配在 TRAVEL 组，缺省 DEFAULT_GROUP 拉空
      # X-2a：服务发现接线（默认关=不注册不发现；server-addr 为自裁决修订项——discovery
      # 不继承 config 作用域键，缺省回落 localhost:8848，live-fire 陷阱预防）
      discovery:
        enabled: ${NACOS_ENABLED:true}
        server-addr: ${NACOS_ADDR:192.168.253.129:8848}
        namespace: ${NACOS_NAMESPACE:dev}  # AR-1（X 审计修复）：配置在 dev 命名空间，缺省连 public 拉不到
    # X-2b：Feign 熔断开关（默认 false=现状异常直抛，KnowledgeClientFallbackFactory 仅挂接
    # 不接管；开启归审计实弹配置）
    openfeign:
      circuitbreaker:
        enabled: false
    # Y-2a：Sentinel 主闸（r1 修复：starter 默认自动注册 Web 拦截器，缺主闸=依赖上桌即行为变化；
    # 默认关=全链路不初始化，E-33 关闭态字节等价；开启+dashboard 不可达=fail-open 不影响服务）
    sentinel:
      enabled: ${SENTINEL_ENABLED:false}
      transport:
        dashboard: ${SENTINEL_DASHBOARD:192.168.253.129:8858}
      eager: false
      # Y-2c：规则 Nacos 数据源（r1：namespace/group 显式写死在 datasource 节内，不复用 config 段两键
      # ——AR-1/AR-2 同类陷阱预防；未灌配 dataId=无规则=全放行零行为；灌配手册见 docs/zcode/20260925_review/）
      datasource:
        flow-ds:
          nacos:
            server-addr: ${NACOS_ADDR:192.168.253.129:8848}
            namespace: dev
            groupId: TRAVEL  # AR-3（Y 审计修复）：SCA datasource 属性名是 groupId，group 被静默忽略→DEFAULT_GROUP 拉空
            data-id: travel-sentinel-flow-planning.json
            rule-type: flow
        # Z-2a：degrade 规则 Nacos 数据源（熔断第二层，r1 候选方向②；与 flow-ds 同构，属性名口径同 AR-3；
        # dataId 与已灌文件逐字一致（docs/zcode/20260926_review/sentinel_degrade/）；
        # 随 SENTINEL_ENABLED 主闸默认 false 不加载=关闭态零行为（E-33）；knowledge/gateway 无 feign
        # 出站不接 degrade（Z-2c 口径：无 dataId 灌配=空源）
        degrade-ds:
          nacos:
            server-addr: ${NACOS_ADDR:192.168.253.129:8848}
            namespace: dev
            groupId: TRAVEL
            data-id: travel-sentinel-degrade-planning.json
            rule-type: degrade

  # ============ 数据源 ============
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/travel_planner?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:root}
    # S0 扫描拦截顺带修复（D-04-002）：受控配置不携带默认口令；本地在 application-local.yml 覆盖
    password: ${MYSQL_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  # ============ Redis ============
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # password: 不设置 — Redis 无密码，避免 Redisson 发送 AUTH 空密码
      # 如需密码，设置环境变量 SPRING_DATA_REDIS_PASSWORD=yourpassword
      database: 0
      timeout: 5000ms

  # ============ Elasticsearch（planning 只读访问） ============
  elasticsearch:
    uris: http://${ES_HOST:localhost}:${ES_PORT:9200}

  # ============ RabbitMQ（Y-3b：事件总线 rabbit 通道连接参数） ============
  # 凭据不落 yml（M21 纪律）：RABBITMQ_USER/PASSWORD 经环境变量注入（compose 明文账号
  # travel/travel2026 仅 VM 侧，见 docs/zcode/20260925_review/部署手册v2.md）；默认空=未配置。
  # type=redis（默认）时本连接参数惰性零使用；rabbit 通道实弹归审计。
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:}
    password: ${RABBITMQ_PASSWORD:}

# ============ Sentinel Feign 整合（Z-2b，r1 设计） ============
# 键名经 SCA 2025.0.0.0 starter 字节码核验（javap SentinelFeignAutoConfiguration）：
# feignSentinelBuilder @Bean @ConditionalOnProperty(name=["feign.sentinel.enabled"])
# ——实际键名=旧形态 feign.sentinel.enabled（非 spring.cloud.openfeign.sentinel.enabled，备选留痕作废）；
# 类在 com.alibaba.cloud.sentinel.feign 且已列 AutoConfiguration.imports（classpath 前置核验通过）。
# 默认 false=条件不匹配=SentinelFeign Builder 不装配=Feign 走默认 Builder（E-33 关闭态字节等价）；
# 开启=KnowledgeClient 五方法自动成 Sentinel 资源→degrade 命中→既有 fallbackFactory 接管（零新代码），
# 开启态实弹归审计；天气/地图不埋（已有本地 CircuitBreaker 守卫，双熔断无必要）。
feign:
  sentinel:
    enabled: ${SENTINEL_FEIGN_ENABLED:false}

# ============ 应用专属配置（进程独有） ============
travel:
  # M25（E5）：分享 token 有效期（天，1~30 clamp）
  share:
    token-ttl-days: ${SHARE_TOKEN_TTL_DAYS:7}
  # M11-3：可靠性看板管理员白名单（空=无管理员，生产用环境变量 ADMIN_USER_IDS 注入）
  admin:
    user-ids: ${ADMIN_USER_IDS:2}
  # F104 P1：MinIO 业务对象存储（头像 avatars 桶）
  minio:
    endpoint: http://${MIDDLEWARE_HOST:192.168.253.129}:9000
    access-key: minioadmin
    secret-key: minioadmin
    attractions-bucket: attractions
    avatars-bucket: avatars
# ============ Actuator ============
management:
  # Y-3b（r1）：spring-rabbit 上桌后 actuator 会聚合 rabbit 健康指示器——默认显式关，
  # 防 VM 不可达时 /actuator/health 误报 DOWN；审计开 rabbit 实弹时一并置 true
  health:
    rabbit:
      enabled: false

