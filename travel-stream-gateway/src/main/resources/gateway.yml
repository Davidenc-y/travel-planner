# V-3：独立流式网关配置（travel-stream-gateway，端口 8083）
# 纯传输层：仅 JWT 验证 + SSE 转发 + 限流；业务全在 planning 进程（8081）。
# 本文件为网关唯一配置源（应用入口 spring.config.name=gateway）；
# V 批次 yml 新键仅限本文件（既有键零改值）。
server:
  port: 8083

spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - com.baomidou.mybatisplus.autoconfigure.MybatisPlusAutoConfiguration
  application:
    name: travel-stream-gateway
  # X-1b：Nacos 配置中心接线（E-33：NACOS_ENABLED=false=整体关闭，禁用解析器跳过 import=零键值变化；
  # optional: 前缀容忍 dataId 缺席；dataId 灌配见 docs/zcode/20260924_review/Nacos部署与灌配手册.md）
  config:
    import: optional:nacos:travel-common.yaml,optional:nacos:travel-gateway.yaml
  # X-1b：配置中心接线（默认值=E-33 现状等价；server-addr 默认=VM 契约地址）
  cloud:
    nacos:
      config:
        enabled: ${NACOS_ENABLED:false}
        server-addr: ${NACOS_ADDR:192.168.253.129:8848}
        namespace: ${NACOS_NAMESPACE:dev}  # AR-1（X 审计修复）：配置在 dev 命名空间，缺省连 public 拉不到
        group: TRAVEL  # AR-2（X 审计修复）：灌配在 TRAVEL 组，缺省 DEFAULT_GROUP 拉空
      # X-2a：服务发现接线（默认关=不注册不发现；server-addr 为自裁决修订项——discovery
      # 不继承 config 作用域键，缺省回落 localhost:8848，live-fire 陷阱预防）
      discovery:
        enabled: ${NACOS_ENABLED:false}
        server-addr: ${NACOS_ADDR:192.168.253.129:8848}
        namespace: ${NACOS_NAMESPACE:dev}  # AR-1（X 审计修复）：配置在 dev 命名空间，缺省连 public 拉不到
  # 锁定 Reactive：travel-common 传递引入 spring-webmvc（其 MVC 横切件依赖），
  # Boot WebApplicationType 推断见 DispatcherServlet 会误判 SERVLET，而 classpath
  # 无 servlet 容器（仅 validation 的 tomcat-embed-el）→ 必须显式锁定 REACTIVE
  main:
    web-application-type: reactive

travel:
  gateway:
    # planning 基座地址（V-3c PlanningStreamClient WebClient SSE 消费目标）
    planning-base-url: ${PLANNING_BASE_URL:http://localhost:8081}
    # X-2c：服务名模式开关（空串=URL 模式现状零行为；非空=经 @LoadBalanced 服务发现负载均衡，
    # 仅审计实弹开启——需 NACOS_ENABLED=true + planning 已注册）
    planning-service-name: ""
    # 超时对齐 chat-stream ChatStreamProperties（timeout 默认 330s）
    connect-timeout-ms: 5000
    response-timeout-ms: 330000
    # SSE 心跳对齐 ChatStreamProperties.keepaliveMs（V-3c 心跳间隔）
    heartbeat-interval-ms: 15000

# jwt 键：common TokenAuthService @Value 实际绑定顶层 jwt.*（jwt.secret 空=启动
# fail-fast，M21-1 受控配置不携带默认密钥——本地经环境变量 JWT_SECRET 注入）
jwt:
  secret: ${JWT_SECRET:}
  expiration: 86400000
  refresh-expiration: 604800000
